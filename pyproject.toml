[project]
name = "crypto-agent-risk"
version = "0.1.0"
description = "Crypto token risk intelligence MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.0",
    "httpx[socks]>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_agent_risk"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
